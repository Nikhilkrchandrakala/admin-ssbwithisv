<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway - SSB Admin Portal</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./assets/css/admin-global.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        
        .login-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(224, 194, 20, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
        }

        .login-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(224, 194, 20, 0.15);
            padding: 50px 40px;
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header .logo-icon {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(224, 194, 20, 0.3));
        }

        .login-header h2 {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-white);
            opacity: 0.5;
            font-size: 0.9rem;
        }

        .form-floating > .form-control {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: var(--radius-sm);
        }

        .form-floating > .form-control:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary-gold);
            box-shadow: none;
        }

        .form-floating > label {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--primary-gold);
            opacity: 0.8;
        }

        .login-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            width: 100%;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(224, 194, 20, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="login-orb"></div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h2>Admin Gateway</h2>
            <p>Access the SSB secure management suite</p>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">Email Address</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Security Password</label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i> Authenticate
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin.js"></script>
</body>
</html>
