<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Management - SSB Admin</title>

    <!-- Bootstrap 5 CSS (Grid Only) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Admin Global Design System -->
    <link rel="stylesheet" href="./assets/css/admin-global.css" />
    <link rel="stylesheet" href="./assets/css/admin-header.css" />

    <style>
        .blog-card {
            background: var(--surface-dark);
            border: var(--border-gold);
            border-radius: var(--radius-md);
            padding: 20px;
            transition: var(--transition);
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .blog-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--primary-gold); }
        .blog-image-wrapper { height: 180px; overflow: hidden; border-radius: 8px; margin-bottom: 15px; background: #2a2a2a; }
        .blog-image { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .blog-card:hover .blog-image { transform: scale(1.05); }
        .blog-title { color: var(--primary-gold); font-size: 1.25rem; font-weight: 600; margin-bottom: 10px; }
        .blog-excerpt { color: var(--text-white); opacity: 0.8; font-size: 0.9rem; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .blog-meta { margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-white); opacity: 0.6; }
        .blog-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-icon-btn { background: none; border: 1px solid rgba(224,194,20,0.3); color: var(--primary-gold); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; transition: var(--transition); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .action-icon-btn:hover { background: var(--primary-gold); color: #000; }
        .action-icon-btn.delete { border-color: #ff6b6b; color: #ff6b6b; }
        .action-icon-btn.delete:hover { background: #ff6b6b; color: #fff; }
        
        .modal-content { background: var(--surface-dark); border: var(--border-gold); color: var(--text-white); }
        .modal-header, .modal-footer { border-color: rgba(224,194,20,0.2); }
        .btn-close { filter: invert(1); }
    </style>
</head>

<body>
    <header class="admin-dashboard-navbar"></header>

    <div class="container" style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <div class="admin-page-header">
            <div class="header-left">
                <h1 class="admin-page-title"><i class="fas fa-newspaper me-2"></i> Blog Management</h1>
                <p class="text-muted mb-0">Create, edit and manage your platform articles</p>
            </div>
            <a href="./Blogs.html" class="thm-btn">
                <i class="fas fa-plus-circle"></i> Add New Blog
            </a>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner text-center" style="display: none; padding: 50px;">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2">Loading blogs...</p>
        </div>

        <!-- Blogs Grid -->
        <div class="row" id="blogsGrid"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state text-center" style="display: none; padding: 60px;">
            <div class="empty-state-icon mb-3" style="font-size: 4rem; color: var(--primary-gold); opacity: 0.5;">
                <i class="fas fa-file-alt"></i>
            </div>
            <h3>No Blogs Found</h3>
            <p>You haven't created any blog posts yet.</p>
            <a href="./Blogs.html" class="thm-btn"><i class="fas fa-plus"></i> Add Your First Blog</a>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this blog? This action cannot be undone.</p>
                    <input type="hidden" id="blogIdToDelete">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="thm-btn" style="padding: 8px 25px;" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin-header.js"></script>

    <script>
        // DOM Elements
        const blogsGrid = document.getElementById('blogsGrid');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const emptyState = document.getElementById('emptyState');
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const blogIdToDelete = document.getElementById('blogIdToDelete');

        // Global Variables
        let blogs = [];
        let blogToDelete = null;

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to access this page.');
                window.location.href = '/';
                return false;
            }
            return token;
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Load all blogs
        async function loadBlogs() {
            const token = checkAuth();
            if (!token) return;

            try {
                loadingSpinner.style.display = 'block';
                blogsGrid.innerHTML = '';
                emptyState.style.display = 'none';

                const response = await fetch(`${config.backendBaseUrl}/api/allBlogs`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load blogs');
                }

                blogs = await response.json();

                if (blogs.length === 0) {
                    emptyState.style.display = 'block';
                    blogsGrid.style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    blogsGrid.style.display = 'flex';
                    renderBlogs(blogs);
                }

            } catch (error) {
                console.error('Error loading blogs:', error);
                alert('Error loading blogs: ' + error.message);
                blogsGrid.innerHTML = `<div class="col-12"><div class="alert alert-danger">Failed to load blogs.</div></div>`;
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        // Render blogs to the grid
        function renderBlogs(blogs) {
            blogsGrid.innerHTML = '';
            blogs.forEach(blog => {
                const blogCard = createBlogCard(blog);
                blogsGrid.appendChild(blogCard);
            });
        }

        // Create blog card HTML
        function createBlogCard(blog) {
            const colDiv = document.createElement('div');
            colDiv.className = 'col-md-6 col-lg-4 mb-4';

            const blogImage = blog?.images && blog.images.length > 0 && blog.images[0].imageUrl
                ? blog.images[0].imageUrl
                : 'https://via.placeholder.com/400x200/1f1f1f/715c20?text=No+Image';

            const formattedDate = formatDate(blog.createdAt || blog.updatedAt);

            colDiv.innerHTML = `
                <div class="blog-card">
                    <div class="blog-image-wrapper">
                        <img src="${blogImage}" alt="${blog.title}" class="blog-image" 
                             onerror="this.src='https://via.placeholder.com/400x200/1f1f1f/715c20?text=Image+Error'">
                    </div>
                    <h3 class="blog-title" title="${blog.title}">
                        ${blog.title.length > 50 ? blog.title.substring(0, 50) + '...' : blog.title}
                    </h3>
                    <p class="blog-excerpt">
                        ${blog.shortDescription.length > 100 ? blog.shortDescription.substring(0, 100) + '...' : blog.shortDescription}
                    </p>
                    <div class="blog-meta">
                        <span><i class="fas fa-user me-1"></i> ${blog.authorName}</span>
                        <span><i class="far fa-calendar me-1"></i> ${formattedDate}</span>
                    </div>
                    <div class="blog-actions">
                        <a href="Blogs.html?id=${blog._id}" class="action-icon-btn">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <button class="action-icon-btn delete" onclick="showDeleteModal('${blog._id}')">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </div>
            `;
            return colDiv;
        }

        function showDeleteModal(blogId) {
            blogToDelete = blogId;
            blogIdToDelete.value = blogId;
            deleteModal.show();
        }

        async function deleteBlog(blogId) {
            const token = checkAuth();
            if (!token) return;
            try {
                const response = await fetch(`${config.backendBaseUrl}/api/deleteBlog/${blogId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to delete blog');
                alert('Blog deleted successfully');
                loadBlogs();
            } catch (error) {
                console.error('Error deleting blog:', error);
                alert('Error deleting blog: ' + error.message);
            }
        }

        confirmDeleteBtn.addEventListener('click', () => {
            if (blogToDelete) {
                deleteBlog(blogToDelete);
                deleteModal.hide();
                blogToDelete = null;
            }
        });

        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>

</html>
