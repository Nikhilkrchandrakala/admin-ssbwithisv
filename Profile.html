<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SSB Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/admin-global.css" />
    <link rel="stylesheet" href="./assets/css/admin-header.css" />
    
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }

        .profile-card-header {
            border-bottom: 1px solid rgba(224, 194, 20, 0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-card-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0;
            color: #fff;
        }

        .profile-card-header i {
            color: var(--primary-gold);
        }

        .profile-badge-display {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(224, 194, 20, 0.1);
            color: var(--primary-gold);
            border: 1px solid rgba(224, 194, 20, 0.2);
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header class="admin-dashboard-navbar"></header>

    <div class="profile-container">
        <div class="admin-page-header">
            <div class="header-left">
                <h1 class="admin-page-title"><i class="fas fa-user-circle me-2"></i> Profile Settings</h1>
                <p class="text-muted mb-0">Manage your administrative personal details and security configuration</p>
                <div id="roleBadgeContainer"></div>
            </div>
        </div>

        <div class="profile-grid">
            <!-- Section 1: Personal Info -->
            <div class="admin-card">
                <div class="profile-card-header">
                    <i class="fas fa-id-card fa-lg"></i>
                    <h2>Personal Information</h2>
                </div>
                <form id="profileDetailsForm">
                    <div class="admin-form-group">
                        <label class="admin-form-label">Full Name</label>
                        <input type="text" id="profileName" class="admin-input" required placeholder="Enter full name">
                    </div>

                    <div class="admin-form-group">
                        <label class="admin-form-label">Email Address</label>
                        <input type="email" id="profileEmail" class="admin-input" readonly disabled 
                            style="background: #202020; border-color: #444; color: #888; cursor: not-allowed; opacity: 0.7;">
                        <span class="small text-muted mt-1 d-block"><i class="fas fa-info-circle"></i> Email address is primary and cannot be changed.</span>
                    </div>

                    <div class="admin-form-group">
                        <label class="admin-form-label">Phone Number</label>
                        <input type="text" id="profilePhone" class="admin-input" required placeholder="e.g. +91 98765 43210">
                    </div>

                    <button type="submit" class="thm-btn w-100 mt-4 py-2">
                        <i class="fas fa-save me-2"></i> Save Profile Details
                    </button>
                </form>
            </div>

            <!-- Section 2: Password Update -->
            <div class="admin-card">
                <div class="profile-card-header">
                    <i class="fas fa-shield-halved fa-lg"></i>
                    <h2>Security & Password</h2>
                </div>
                <form id="profilePasswordForm">
                    <div class="admin-form-group">
                        <label class="admin-form-label">Current Security Password</label>
                        <div class="position-relative">
                            <input type="password" id="currentPassword" class="admin-input" required placeholder="Verify current password" style="padding-right: 45px;">
                            <button type="button" onclick="togglePasswordVisibility('currentPassword', this)" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 10; transition: color 0.2s;"><i class="fas fa-eye-slash"></i></button>
                        </div>
                    </div>

                    <div class="admin-form-group">
                        <label class="admin-form-label">New Security Password</label>
                        <div class="position-relative">
                            <input type="password" id="newPassword" class="admin-input" required placeholder="Enter new password" style="padding-right: 45px;">
                            <button type="button" onclick="togglePasswordVisibility('newPassword', this)" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 10; transition: color 0.2s;"><i class="fas fa-eye-slash"></i></button>
                        </div>
                    </div>

                    <div class="admin-form-group">
                        <label class="admin-form-label">Confirm New Password</label>
                        <div class="position-relative">
                            <input type="password" id="confirmNewPassword" class="admin-input" required placeholder="Re-enter new password" style="padding-right: 45px;">
                            <button type="button" onclick="togglePasswordVisibility('confirmNewPassword', this)" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 10; transition: color 0.2s;"><i class="fas fa-eye-slash"></i></button>
                        </div>
                    </div>

                    <button type="submit" class="thm-btn w-100 mt-4 py-2">
                        <i class="fas fa-key me-2"></i> Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin-header.js"></script>
    <script src="./assets/js/profile.js"></script>
    <script>
        function togglePasswordVisibility(inputId, btnEl) {
            const input = document.getElementById(inputId);
            const icon = btnEl.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>

</html>
