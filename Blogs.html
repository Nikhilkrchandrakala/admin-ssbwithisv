<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Blog Management</title>
    <link rel="icon" type="image/png" href="./assets/logo/ISV2.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- CKEditor 5 -->
    <script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>

    <link rel="stylesheet" href="./assets/css/admin-global.css" />
    <link rel="stylesheet" href="./assets/css/admin-header.css" />
    <style>
        .blog-editor-card {
            background: var(--surface-dark);
            border: var(--border-gold);
            border-radius: var(--radius-md);
            padding: 40px;
            margin-bottom: 30px;
        }
        .section-divider {
            height: 1px;
            background: rgba(224, 194, 20, 0.2);
            margin: 30px 0;
        }
        .section-title {
            color: var(--primary-gold);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Image Preview Styles */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .remove-preview {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            z-index: 2;
        }
        
        /* CKEditor Custom Styling */
        .ck-editor__main .ck-content {
            background: var(--surface-dark) !important;
            color: var(--text-white) !important;
            min-height: 300px;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }
        .ck.ck-toolbar {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }
        .ck.ck-button:hover { background: rgba(224, 194, 20, 0.2) !important; }
        .ck.ck-button.ck-on { background: var(--primary-gold) !important; color: #000 !important; }
        
        .upload-area {
            border: 2px dashed rgba(224, 194, 20, 0.3);
            border-radius: var(--radius-md);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255,255,255,0.02);
        }
        .upload-area:hover { background: rgba(224, 194, 20, 0.05); border-color: var(--primary-gold); }
        .upload-area i { font-size: 3rem; color: var(--primary-gold); margin-bottom: 15px; }
        
        .image-text-fields { margin-top: 25px; }
        .image-field-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
        }
        .image-field-thumb {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <header class="admin-dashboard-navbar"></header>

    <div class="container" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
        <div class="admin-page-header">
            <div class="header-left">
                <h1 class="admin-page-title" id="pageMainTitle"><i class="fas fa-edit me-2"></i> Create Blog Post</h1>
                <p class="text-muted mb-0">Compose and publish insightful articles for your audience</p>
            </div>
            <a href="./BlogList.html" class="thm-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);">
                <i class="fas fa-arrow-left me-2"></i> Back to List
            </a>
        </div>

        <div class="blog-editor-card">
            <form id="adminBlogFrom">
                <input type="hidden" id="blogId">

                <!-- Basic Details -->
                <div class="section-title"><i class="fas fa-info-circle"></i> Basic Information</div>
                <div class="mb-4">
                    <label class="admin-form-label">Blog Title *</label>
                    <input type="text" id="blogTitle" class="admin-input" placeholder="e.g. Master the SSB Interview" required>
                </div>
                <div class="mb-4">
                    <label class="admin-form-label">Short Summary *</label>
                    <textarea id="shortDescription" class="admin-input" rows="3" placeholder="A brief catchphrase for the blog list (max 200 chars)" required></textarea>
                </div>

                <div class="section-divider"></div>

                <!-- Content Area -->
                <div class="section-title"><i class="fas fa-pen-nib"></i> Article Content</div>
                <div class="mb-4">
                    <label class="admin-form-label">Full Content *</label>
                    <div id="editorContainer"></div>
                </div>

                <div class="section-divider"></div>

                <!-- Media Section -->
                <div class="section-title"><i class="fas fa-images"></i> Media & Visuals</div>
                <div class="mb-3">
                    <label class="admin-form-label">Upload Blog Images</label>
                    <div class="upload-area" id="blogImgUploadArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <h5>Click or Drag images to upload</h5>
                        <p class="text-muted small">PNG, JPG or GIF up to 5MB each (Multiple allowed)</p>
                        <input type="file" id="blogImgInput" multiple accept="image/*" style="display:none;">
                    </div>
                </div>

                <!-- New Previews -->
                <div id="blogImgPreviewContainer" class="preview-grid mb-4"></div>

                <!-- Image Text Inputs -->
                <div id="imageTextsContainer" class="image-text-fields mb-4"></div>

                <div class="section-divider"></div>

                <!-- Author Info -->
                <div class="section-title"><i class="fas fa-user-edit"></i> Publication Credits</div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="admin-form-label">Author Name *</label>
                        <input type="text" id="authorName" class="admin-input" placeholder="e.g. Capt. Vikram Batra" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="admin-form-label">Read Time (Duration) *</label>
                        <input type="text" id="timeDuration" class="admin-input" placeholder="e.g. 5 min read" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="admin-form-label">Author Quote (Optional)</label>
                    <input type="text" id="authorQuote" class="admin-input" placeholder="A short inspiring quote from the author">
                </div>

                <div class="mt-5 d-flex gap-3">
                    <button type="submit" class="thm-btn" id="submitBtn" style="min-width: 200px;">
                        <i class="fas fa-paper-plane me-2"></i> Publish Article
                    </button>
                    <button type="button" id="cancelBtn" class="thm-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);">
                        Discard Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin-header.js"></script>
    <script src="./assets/js/Blogs.js"></script>
</body>

</html>
