<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Leads Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/admin-global.css" />
    <link rel="stylesheet" href="./assets/css/admin-header.css" />
    <style>
        .filter-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 15px;
        }
        .filter-item { flex: 1; min-width: 200px; }
        .filter-actions { display: flex; gap: 10px; flex: 2; min-width: 300px; justify-content: flex-end; }
        
        #excelDownloadBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--gradient-gold);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: var(--transition);
            z-index: 1000;
        }
        #excelDownloadBtn:hover { transform: scale(1.1) rotate(5deg); }
        #excelDownloadBtn i { font-size: 1.5rem; color: #000; }
        
        .lead-name { font-weight: 600; color: var(--primary-gold); }
        .lead-contact { font-size: 0.85rem; opacity: 0.7; }
        .date-badge { font-family: monospace; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>

<body>
    <header class="admin-dashboard-navbar"></header>

    <div class="container" style="max-width: 1400px; margin: 40px auto; padding: 0 20px;">
        <div class="admin-page-header">
            <div class="header-left">
                <h1 class="admin-page-title"><i class="fas fa-address-book me-2"></i> Leads Management</h1>
                <p class="text-muted mb-0">Track and export inquiry leads from the magazine and website</p>
            </div>
            <div id="filterInfoMsg" class="badge" style="background: rgba(224, 194, 20, 0.1); color: var(--primary-gold); border: 1px solid rgba(224, 194, 20, 0.2); padding: 8px 15px;">
                Loading leads...
            </div>
        </div>

        <!-- Filter Panel -->
        <div class="filter-panel">
            <div class="filter-item">
                <label class="admin-form-label"><i class="far fa-calendar-alt me-1"></i> From Date</label>
                <input type="date" id="fromDate" class="admin-input">
            </div>
            <div class="filter-item">
                <label class="admin-form-label"><i class="far fa-calendar-check me-1"></i> To Date</label>
                <input type="date" id="toDate" class="admin-input">
            </div>
            <div class="filter-actions">
                <button id="applyDateFilterBtn" class="thm-btn" style="min-width: 130px;">
                    <i class="fas fa-search me-2"></i> Apply Filter
                </button>
                <button id="clearDateFilterBtn" class="thm-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); min-width: 100px;">
                    <i class="fas fa-undo me-2"></i> Clear
                </button>
                <button id="exportFilteredExcelBtn" class="thm-btn" style="background: #27ae60; border-color: #2ecc71; min-width: 160px;">
                    <i class="fas fa-file-excel me-2"></i> Export Excel
                </button>
            </div>
        </div>

        <!-- Leads Table Section -->
        <div class="admin-card">
            <div id="tableLoading" class="loading-spinner text-center" style="display: none; padding: 60px;">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-3">Fetching leads data...</p>
            </div>

            <div id="leadsTableWrapper" class="admin-table-container">
                <table class="admin-table" id="leadsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Inquiry Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone Number</th>
                            <th>Source</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody"></tbody>
                </table>
            </div>

            <div id="emptyLeadsState" class="empty-state text-center" style="display: none; padding: 80px;">
                <div class="empty-icon mb-3" style="font-size: 4rem; color: var(--primary-gold); opacity: 0.3;">
                    <i class="fas fa-inbox"></i>
                </div>
                <h3>No Leads Found</h3>
                <p>There are no leads matching your current filter criteria.</p>
            </div>
        </div>
    </div>

    <!-- Floating Action Button for ALL Export -->
    <button id="excelDownloadBtn" title="Download all leads as Excel">
        <i class="fas fa-download"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin-header.js"></script>
    <script src="./assets/js/leads.js"></script>
</body>

</html>
