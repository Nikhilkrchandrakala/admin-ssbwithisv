<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Candidate Management</title>
    <link rel="icon" type="image/png" href="./assets/logo/ISV2.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <link rel="stylesheet" href="./assets/css/admin-global.css" />
    <link rel="stylesheet" href="./assets/css/admin-header.css" />
    <style>
        .candidate-img-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-gold);
        }
        .upload-zone {
            border: 2px dashed rgba(224, 194, 20, 0.3);
            border-radius: var(--radius-md);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }
        .upload-zone:hover {
            background: rgba(224, 194, 20, 0.05);
            border-color: var(--primary-gold);
        }
        .upload-icon { font-size: 2.5rem; color: var(--primary-gold); margin-bottom: 10px; }
        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--radius-sm);
            margin-top: 15px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* DataTables Custom Styling */
        .dataTables_wrapper .dataTables_length, 
        .dataTables_wrapper .dataTables_filter, 
        .dataTables_wrapper .dataTables_info, 
        .dataTables_wrapper .dataTables_processing, 
        .dataTables_wrapper .dataTables_paginate {
            color: var(--text-white) !important;
            margin-bottom: 15px;
        }
        .dataTables_wrapper .dataTables_filter input {
            background: var(--surface-dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 20px;
            padding: 5px 15px;
        }
        .dataTables_wrapper .dataTables_length select {
            background: var(--surface-dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 10px;
        }
        .page-link {
            background: var(--surface-dark);
            border-color: rgba(255,255,255,0.1);
            color: var(--primary-gold);
        }
        .page-item.active .page-link {
            background: var(--primary-gold);
            border-color: var(--primary-gold);
            color: #000;
        }
    </style>
</head>

<body>
    <header class="admin-dashboard-navbar"></header>

    <div class="container" style="max-width: 1400px; margin: 40px auto; padding: 0 20px;">
        <div class="admin-page-header">
            <div class="header-left">
                <h1 class="admin-page-title"><i class="fas fa-user-graduate me-2"></i> Candidate Management</h1>
                <p class="text-muted mb-0">Manage successful candidates, their records, and display status</p>
            </div>
            <button class="thm-btn" data-bs-toggle="modal" data-bs-target="#addCandidateModal">
                <i class="fas fa-plus-circle"></i> Add New Candidate
            </button>
        </div>

        <div class="admin-card">
            <div class="admin-table-container">
                <table id="candidatesTable" class="admin-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Entry No</th>
                            <th>Board</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Candidate Modal -->
    <div class="modal fade" id="addCandidateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content admin-modal">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i> Add New Candidate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addCandidateForm">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="admin-form-label">Full Name *</label>
                                    <input type="text" class="admin-input" name="name" required placeholder="Enter candidate name">
                                </div>
                                <div class="mb-3">
                                    <label class="admin-form-label">Entry Number *</label>
                                    <input type="text" class="admin-input" name="entry" required placeholder="e.g. SSB-2024-001">
                                </div>
                                <div class="mb-3">
                                    <label class="admin-form-label">SSB Board *</label>
                                    <input type="text" class="admin-input" name="board" required placeholder="e.g. 1 AFSB Varanasi">
                                </div>
                                <div class="mb-3">
                                    <label class="admin-form-label">Status</label>
                                    <select class="admin-input" name="status">
                                        <option value="active">Active (Visible)</option>
                                        <option value="inactive">Inactive (Hidden)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="admin-form-label">Candidate Photo *</label>
                                <div class="upload-zone" id="imageUploadArea">
                                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                                    <div class="upload-text">Click or Drag to Upload Photo</div>
                                    <div class="text-muted small">JPG, PNG (Max 5MB)</div>
                                    <input type="file" id="imageInput" accept="image/*" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
                                </div>
                                <div class="text-center">
                                    <img id="imagePreview" class="preview-img" alt="Preview">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="thm-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="thm-btn" id="submitCandidateBtn">Create Candidate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Candidate Modal -->
    <div class="modal fade" id="editCandidateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content admin-modal">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit me-2"></i> Edit Candidate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editCandidateForm">
                    <input type="hidden" id="editCandidateId">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="admin-form-label">Full Name *</label>
                                    <input type="text" class="admin-input" id="editName" name="name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="admin-form-label">Entry Number *</label>
                                    <input type="text" class="admin-input" id="editEntry" name="entry" required>
                                </div>
                                <div class="mb-3">
                                    <label class="admin-form-label">SSB Board *</label>
                                    <input type="text" class="admin-input" id="editBoard" name="board" required>
                                </div>
                                <div class="mb-3">
                                    <label class="admin-form-label">Status</label>
                                    <select class="admin-input" id="editStatus" name="status">
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="admin-form-label">Change Candidate Photo</label>
                                <div class="upload-zone" id="editImageUploadArea">
                                    <div class="upload-icon"><i class="fas fa-image"></i></div>
                                    <div class="upload-text">Click to change photo</div>
                                    <input type="file" id="editImageInput" accept="image/*" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
                                </div>
                                <div class="text-center">
                                    <img id="editImagePreview" class="preview-img" alt="Preview">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="thm-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="thm-btn" id="updateCandidateBtn">Update Candidate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin-header.js"></script>
    <script src="./assets/js/candidate.js"></script>
</body>

</html>
