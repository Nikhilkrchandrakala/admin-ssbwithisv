<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Candidate Management</title>

    <link rel="stylesheet" href="./assets/css/admin-header.css" />
    <link rel="stylesheet" href="./assets/css/candidate.css" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome for icons -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />


    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <style>
        /* Additional styles for better UX */
        .required::after {
            content: " *";
            color: #ff4757;
        }

        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;

            
        }

        .thm-input:required:invalid {
            border-color: #ff4757;
        }

        .thm-input:required:valid {
            border-color: #2ed573;
        }

        /* Image preview styles */
        .candidate-image-preview {
            display: none;
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 5px;
            border: 2px solid var(--theme-color);
        }

        /* Image upload area */
        .candidate-image-upload-area {
            border: 2px dashed var(--theme-color);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .candidate-image-upload-area:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--theme-white);
        }

        .candidate-image-upload-icon {
            font-size: 48px;
            color: var(--theme-color);
            margin-bottom: 10px;
        }

        .candidate-image-upload-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .candidate-image-upload-subtext {
            font-size: 12px;
            color: var(--theme-white);
            opacity: 0.7;
        }

        .candidate-image-upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>

<body style="background-color: var(--dark-gray); color: var(--theme-white);">

    <header class="admin-dashboard-navbar">
        <div class="admin-dashboard-left">
            <img src="./assets/imgs/admin-img.jpg" alt="Admin Image" class="admin-dashboard-image">
            Hi  Superadmin;👋🏻
        </div>
        <div class="admin-dashboard-right">
            <a href="./dashboard.html" class="admin-dashboard-link ">DashBoard</a>
            <a href="./magazine.html" class="admin-dashboard-link ">Magazine</a>
            <a href="./BlogList.html" class="admin-dashboard-link">Blogs</a>
            <a href="./candidate.html" class="admin-dashboard-link active">Candidates</a>
            <a href="./Gallery.html" class="admin-dashboard-link ">Gallery</a>
            <a href="./Courses.html" class="admin-dashboard-link ">Courses</a>
            <a href="./Franchise.html" class="admin-dashboard-link ">Franchise</a>
            <a href="./TotalSales.html" class="admin-dashboard-link ">Total Sales</a>
      <a href="./CouponManagement.html" class="admin-dashboard-link ">Coupons</a>





            <a href="./leads.html" class="admin-dashboard-link">Leads</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </header>

    <div class="container mt-4">
        <!-- Header -->
        <div class="admin-candidate-header">
            <h1>Candidate Management</h1>
            <button class="thm-btn1" data-bs-toggle="modal" data-bs-target="#addCandidateModal">
                <i class="fas fa-plus me-2"></i>Add New Candidate
            </button>
        </div>

        <!-- Candidates Table -->
        <div class="table-container">
            <table id="candidatesTable" class="table table-hover">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Entry No</th>
                        <th>Board</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be loaded via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Candidate Modal -->
    <div style="background-color: var(--dark-gray); color: var(--theme-white);" class="modal fade"
        id="addCandidateModal" tabindex="-1" aria-labelledby="addCandidateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCandidateModalLabel">Add New Candidate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addCandidateForm">
                    <div class="modal-body">
                        <div class="row">
                            <!-- Left Column -->
                            <div class="col-md-6">
                                <!-- Name -->
                                <div class="mb-3">
                                    <label for="name" class="form-label required">Name</label>
                                    <input type="text" class="thm-input" id="name" name="name" required>
                                </div>

                                <!-- Entry Number -->
                                <div class="mb-3">
                                    <label for="entry" class="form-label required">Entry Number</label>
                                    <input type="text" class="thm-input" id="entry" name="entry" required>
                                </div>

                                <!-- Board -->
                                <div class="mb-3">
                                    <label for="board" class="form-label required">Board</label>
                                    <input type="text" class="thm-input" id="board" name="board" required>
                                </div>

                                <!-- Status -->
                                <div class="mb-3">
                                    <label for="status" class="form-label">Status</label>
                                    <select class="thm-input" id="status" name="status">
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Right Column - Image Upload -->
                            <div class="col-md-6">
                                <label class="form-label required">Candidate Image</label>
                                <!-- Image upload area -->
                                <div class="candidate-image-upload-area" id="imageUploadArea">
                                    <div class="candidate-image-upload-icon">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                    </div>
                                    <div class="candidate-image-upload-text">
                                        Click to upload image
                                    </div>
                                    <div class="candidate-image-upload-subtext">
                                        PNG, JPG up to 5MB
                                    </div>
                                    <input type="file" id="imageInput" accept="image/*">
                                </div>
                                <img id="imagePreview" class="candidate-image-preview" src="" alt="Preview">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="thm-btn1 small" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="thm-btn1 small" id="submitCandidateBtn">
                            <span id="submitBtnText">Add Candidate</span>
                            <span id="submitSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Candidate Modal -->
    <div class="modal fade" id="editCandidateModal" tabindex="-1" aria-labelledby="editCandidateModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCandidateModalLabel">Edit Candidate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editCandidateForm">
                    <input type="hidden" id="editCandidateId">
                    <div class="modal-body">
                        <div class="row">
                            <!-- Left Column -->
                            <div class="col-md-6">
                                <!-- Name -->
                                <div class="mb-3">
                                    <label for="editName" class="form-label required">Name</label>
                                    <input type="text" class="thm-input" id="editName" name="name" required>
                                </div>

                                <!-- Entry Number -->
                                <div class="mb-3">
                                    <label for="editEntry" class="form-label required">Entry Number</label>
                                    <input type="text" class="thm-input" id="editEntry" name="entry" required>
                                </div>

                                <!-- Board -->
                                <div class="mb-3">
                                    <label for="editBoard" class="form-label required">Board</label>
                                    <input type="text" class="thm-input" id="editBoard" name="board" required>
                                </div>

                                <!-- Status -->
                                <div class="mb-3">
                                    <label for="editStatus" class="form-label">Status</label>
                                    <select class="thm-input" id="editStatus" name="status">
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Right Column - Image Upload -->
                            <div class="col-md-6">
                                <label class="form-label">Candidate Image</label>
                                <!-- Edit image upload area -->
                                <div class="candidate-image-upload-area" id="editImageUploadArea">
                                    <div class="candidate-image-upload-icon">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                    </div>
                                    <div class="candidate-image-upload-text">
                                        Click to change image
                                    </div>
                                    <div class="candidate-image-upload-subtext">
                                        PNG, JPG up to 5MB
                                    </div>
                                    <input type="file" id="editImageInput" accept="image/*">
                                </div>
                                <img id="editImagePreview" class="candidate-image-preview" src="" alt="Preview">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="thm-btn1 small" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="thm-btn1 small" id="updateCandidateBtn">
                            <span id="updateBtnText">Update Candidate</span>
                            <span id="updateSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <!-- Config JS -->
    <script src="./assets/js/config.js"></script>

    <!-- Candidate JS -->
    <script src="./assets/js/condidate.js"></script>

</body>

</html>
