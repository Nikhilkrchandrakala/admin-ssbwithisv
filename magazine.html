<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine Central - SSB Admin</title>
    <link rel="icon" type="image/png" href="./assets/logo/ISV2.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/admin-global.css" />
    <link rel="stylesheet" href="./assets/css/admin-header.css" />
    <style>
        .magazine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .magazine-card {
            background: var(--surface-dark);
            border: var(--border-gold);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .magazine-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); border-color: var(--primary-gold); }
        
        .cover-wrapper {
            aspect-ratio: 3 / 4; /* Portrait Aspect Ratio */
            overflow: hidden;
            background: #111;
            position: relative;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }
        .magazine-card:hover .cover-img { transform: scale(1.05); }
        
        .magazine-details { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .mag-tag { 
            display: inline-block; 
            padding: 2px 8px; 
            border-radius: 4px; 
            font-size: 0.65rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            background: rgba(224,194,20,0.1); 
            color: var(--primary-gold);
            margin-bottom: 10px;
        }
        .mag-title { color: #fff; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
        
        .mag-actions {
            margin-top: auto;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }
        .mag-btn {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: #fff;
            text-decoration: none;
        }
        .mag-btn:hover { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); }
        .mag-btn.del:hover { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }
    </style>
</head>

<body>
    <header class="admin-dashboard-navbar"></header>

    <div class="container" style="max-width: 1400px; margin: 40px auto; padding: 0 20px;">
        <div class="admin-page-header">
            <div class="header-left">
                <h1 class="admin-page-title"><i class="fas fa-book-open me-2"></i> Digital Library</h1>
                <p class="text-muted mb-0">Publish and organize magazines, books, and study materials</p>
            </div>
            <button class="thm-btn" id="openUploadModal">
                <i class="fas fa-plus-circle me-2"></i> Publish New
            </button>
        </div>

        <div id="loadingState" class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-3 opacity-50">Opening the archives...</p>
        </div>

        <div id="magazineGrid" class="magazine-grid" style="display: none;">
            <!-- Dynamic Content -->
        </div>

        <div id="emptyState" class="text-center py-5" style="display: none;">
            <i class="fas fa-book mb-3" style="font-size: 4rem; opacity: 0.2;"></i>
            <h3>The library is empty</h3>
            <p class="text-muted">Start by publishing your first magazine or study guide.</p>
            <button class="thm-btn mt-3" id="emptyPublishBtn">Publish Now</button>
        </div>
    </div>

    <!-- Upload/Edit Modal -->
    <div class="modal fade" id="magModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content admin-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"><i class="fas fa-upload me-2 text-warning"></i> Publish Asset</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="magForm">
                        <input type="hidden" id="magId">
                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label class="admin-form-label">Asset Title *</label>
                                <input type="text" id="magTitle" class="admin-input" required placeholder="e.g. SSB Monthly May 2024">
                            </div>
                            <div class="col-md-5 mb-3">
                                <label class="admin-form-label">Category *</label>
                                <div class="input-group">
                                    <select id="magCategory" class="admin-input form-select" required style="border-top-right-radius: 0; border-bottom-right-radius: 0; background-color: var(--surface-light); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
                                        <!-- Dynamic Options -->
                                    </select>
                                    <button class="btn btn-outline-warning" type="button" id="addCategoryBtn" title="Add New Category" style="border-radius: 0;"><i class="fas fa-plus"></i></button>
                                    <button class="btn btn-outline-danger" type="button" id="removeCategoryBtn" title="Remove Selected Category" style="border-top-left-radius: 0; border-bottom-left-radius: 0;"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="admin-form-label" id="magPdfLabel">Document File (PDF) *</label>
                                <input type="file" id="magPdf" class="admin-input" accept="application/pdf">
                                <div id="pdfHint" class="small opacity-50 mt-1">Leave empty to keep existing file.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="admin-form-label" id="magImageLabel">Cover Image (Portrait) *</label>
                                <input type="file" id="magImage" class="admin-input" accept="image/*">
                                <div id="imgHint" class="small opacity-50 mt-1">Leave empty to keep existing cover.</div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer px-0 pb-0 pt-3">
                    <button class="thm-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);" data-bs-dismiss="modal">Cancel</button>
                    <button class="thm-btn" id="saveMagBtn">Confirm Publication</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/admin-header.js"></script>
    <script src="./assets/js/magazine.js"></script>
</body>

</html>
